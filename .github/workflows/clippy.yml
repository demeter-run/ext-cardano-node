name: Clippy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./operator
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check trust floor
        working-directory: .
        run: sh scripts/check-trust-floor.sh

      - name: Clippy check lints
        run: cargo clippy -- -D warnings
